<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DoraSaver</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' data: blob:; worker-src 'self' blob:">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage { position: fixed; inset: 0; }
  #stage ruffle-player, #stage ruffle-object, #stage > * { width: 100%; height: 100%; display: block; }
  /* Covers the player so Ruffle never sees the mouse (no hover cursor, no context menu). */
  #shield { position: fixed; inset: 0; z-index: 2147483647; cursor: none; background: transparent; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="shield"></div>
<script src="ruffle/ruffle.js"></script>
<script src="player.js"></script>
</body>
</html>
